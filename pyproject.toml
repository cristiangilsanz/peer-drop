[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "peer-drop"
version = "1.0.0"
description = "Peer-to-peer file sharing with a C directory server, an RPC audit log and a Python client"
readme = "README.md"
license = "MIT"
authors = [{ name = "Cristian Gil Sanz" }, { name = "Paola Herráez Bravo" }]
requires-python = ">=3.10"
dependencies = ["flask>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
peer-drop = "peer_drop.shell:main"
peer-drop-timestamp = "peer_drop.timestamp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
